[package]
name = "ytb2pdf-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "YouTube -> PDF pipeline: captions, frame capture, dedupe, translation, PDF assembly"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
# genpdf 0.2 bundles image 0.23: needed to build the DynamicImage the page
# decorator paints as the background (already compiled as a transitive dep).
image023 = { package = "image", version = "0.23" }
genpdf = { version = "0.2", features = ["images"] }
ureq = { version = "2", features = ["json"] }
lopdf = "0.26"
tempfile = "3"
