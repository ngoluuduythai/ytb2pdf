# Build the macOS app on a real Mac runner. Produces a self-contained arm64
# .dmg: proper .app bundle (with bundled yt-dlp + ffmpeg, no Homebrew needed)
# + drag-to-Applications layout (FilmCraft-style).
name: macOS build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.2.0-rc.1 (blank: unique development version)'
        type: string
        required: false
      publish:
        description: 'Create a draft release after all build and runtime checks pass'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-14 # Apple Silicon
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate and resolve release version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
          python3 scripts/release/prepare.py

      - uses: dtolnay/rust-toolchain@stable

      - name: Install runtime deps (for tests)
        run: brew install yt-dlp ffmpeg poppler cmake

      - name: Build release
        run: cargo build --release -p ytb2pdf-app -p ytb2pdf-cli

      - name: Verify binary release identity
        run: |
          EXPECTED="ytb2pdf $YTB2PDF_VERSION ($YTB2PDF_COMMIT)"
          test "$(target/release/ytb2pdf-app --version)" = "$EXPECTED"
          test "$(target/release/ytb2pdf-cli --version)" = "$EXPECTED"

      - name: Run core tests
        run: cargo test --release -p ytb2pdf-core

      - name: Build .app bundle
        run: |
          APP="dist/ytb2pdf-app.app"
          rm -rf dist && mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/ytb2pdf-app "$APP/Contents/MacOS/"
          cat > "$APP/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Ytb2Pdf</string>
              <key>CFBundleDisplayName</key>
              <string>YouTube to PDF</string>
              <key>CFBundleIdentifier</key>
              <string>com.github.ngoluuduythai.ytb2pdf</string>
              <key>CFBundleVersion</key>
              <string>0.1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>0.1.0</string>
              <key>CFBundleExecutable</key>
              <string>ytb2pdf-app</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          plutil -replace CFBundleShortVersionString -string "${{ steps.release.outputs.bundle_version }}" "$APP/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" "$APP/Contents/Info.plist"
          plutil -insert Ytb2pdfReleaseVersion -string "$YTB2PDF_VERSION" "$APP/Contents/Info.plist"
          plutil -insert Ytb2pdfCommit -string "$YTB2PDF_COMMIT" "$APP/Contents/Info.plist"
          plutil -lint "$APP/Contents/Info.plist"

      - name: Bundle yt-dlp + ffmpeg into the .app
        run: |
         BIN="dist/ytb2pdf-app.app/Contents/Resources/bin"
         mkdir -p "$BIN"
         # yt-dlp: official standalone macOS binary (universal)
         curl -sSL -o "$BIN/yt-dlp" https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
         chmod +x "$BIN/yt-dlp"
         # ffmpeg: static arm64 build shipped in the imageio-ffmpeg wheel
         pip3 install --quiet --break-system-packages imageio-ffmpeg
         cp "$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$BIN/ffmpeg"
         chmod +x "$BIN/ffmpeg"
         # deno: JS runtime so yt-dlp can solve YouTube's JS challenges (EJS)
         curl -sSLf -o /tmp/deno.zip https://github.com/denoland/deno/releases/latest/download/deno-aarch64-apple-darwin.zip
         unzip -o -j /tmp/deno.zip -d "$BIN"
         chmod +x "$BIN/deno"
         rm -f /tmp/deno.zip
         "$BIN/yt-dlp" --version
         "$BIN/ffmpeg" -version 2>&1 | head -1
         "$BIN/deno" --version | head -1


      - name: Bundle whisper.cpp
        run: |
          BIN="dist/ytb2pdf-app.app/Contents/Resources/bin"
          WHISPER_SOURCE="$RUNNER_TEMP/ytb2pdf-whisper"
          git clone --depth 1 --branch v1.8.2 https://github.com/ggml-org/whisper.cpp "$WHISPER_SOURCE"
          cmake -S "$WHISPER_SOURCE" -B "$WHISPER_SOURCE/build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DBUILD_SHARED_LIBS=OFF -DGGML_METAL_EMBED_LIBRARY=ON -DWHISPER_BUILD_TESTS=OFF
          cmake --build "$WHISPER_SOURCE/build" -j 3 --target whisper-cli
          cp "$WHISPER_SOURCE/build/bin/whisper-cli" "$BIN/whisper-cli"
          chmod +x "$BIN/whisper-cli"
          ls -la "$BIN/"

      - name: Bundle and verify complete media runtime
        run: |
          BIN="dist/ytb2pdf-app.app/Contents/Resources/bin"
          cp target/release/ytb2pdf-cli dist/ytb2pdf-app.app/Contents/MacOS/
          for tool in ffprobe pdfunite pdfinfo; do
            cp -L "$(command -v "$tool")" "$BIN/$tool"
          done
          python3 scripts/release/relocate-runtime.py dist/ytb2pdf-app.app
          python3 scripts/release/verify-runtime.py dist/ytb2pdf-app.app
          python3 scripts/release/bundle-metadata.py

      - name: Ad-hoc sign the .app
        run: codesign --force --deep --sign - "dist/ytb2pdf-app.app"  # Replace with Developer ID signing and notarization for distribution

      - name: Package .dmg (drag-to-Applications)
        run: |
          DMG="ytb2pdf-v${YTB2PDF_VERSION}-macos-arm64.dmg"
          rm -rf dmg-root "$DMG"
          mkdir -p dmg-root
          cp -R dist/ytb2pdf-app.app dmg-root/
          cp target/release/ytb2pdf-cli dmg-root/
          cp README.md dmg-root/README.txt
          ln -s /Applications dmg-root/Applications
          cat > /tmp/dmg-layout.scpt <<'EOF'
          tell application "Finder"
              tell disk "Ytb2Pdf"
                  open
                  set current view of container window to icon view
                  set toolbar visible of container window to false
                  set statusbar visible of container window to false
                  set the bounds of container window to {100, 100, 620, 420}
                  set theViewOptions to the icon view options of container window
                  set arrangement of theViewOptions to not arranged
                  set icon size of theViewOptions to 96
                  set position of item "ytb2pdf-app.app" of container window to {150, 180}
                  set position of item "Applications" of container window to {380, 180}
                  close
                  open
                  update without registering applications
                  delay 2
              end tell
          end tell
          EOF
          hdiutil create -size 300m -fs HFS+ -volname "Ytb2Pdf" -format UDRW \
            -o /tmp/ytb2pdf-rw.dmg -srcfolder dmg-root
          hdiutil attach /tmp/ytb2pdf-rw.dmg -nobrowse -mountpoint /Volumes/Ytb2Pdf
          osascript /tmp/dmg-layout.scpt || true
          hdiutil detach /Volumes/Ytb2Pdf
          hdiutil convert /tmp/ytb2pdf-rw.dmg -format UDZO -o "$DMG"
          rm -f /tmp/ytb2pdf-rw.dmg

      - name: Package app ZIP, CLI archive and checksums
        run: |
          python3 scripts/release/package-extras.py
          (cd dist/assets && shasum -a 256 -c SHA256SUMS.txt)

      - name: Verify relocated app and CLI offline
        run: python3 scripts/release/smoke.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytb2pdf-v${{ steps.release.outputs.version }}-macos-arm64
          path: dist/assets/*
          if-no-files-found: error

      - name: Write validation summary
        run: |
          printf 'Validated version: %s\nSource: %s\n\n' "$YTB2PDF_VERSION" "$YTB2PDF_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          printf 'Relocated GUI/CLI, bundled tools and offline PDF exports passed.\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat dist/assets/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"

  draft-release:
    needs: build-macos
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ytb2pdf-v${{ needs.build-macos.outputs.version }}-macos-arm64
          path: dist/assets
      - name: Create verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-macos.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.build-macos.outputs.prerelease }}
          KEEP_DRAFT: 'true'
        run: |
          (cd dist/assets && sha256sum -c SHA256SUMS.txt)
          cp dist/assets/INSTALL.txt dist/RELEASE_NOTES.md
          bash scripts/release/publish.sh
# For trusted distribution, configure Apple Developer ID signing and notarization.
# Without notarization, macOS Gatekeeper may require manual approval.
