name: macOS release
run-name: macOS release · ${{ inputs.version || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.2.0 or 0.2.0-rc.1); blank creates a unique development prerelease'
        type: string
        required: false
      publish:
        description: Publish to GitHub Releases after validation
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve version and source commit
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python3 scripts/release/prepare.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install packaging and media tools
        run: |
          test "$(uname -m)" = arm64
          brew install ffmpeg deno dylibbundler cmake

      - name: Validate release scripts
        run: |
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
          bash -n scripts/release/build-runtime.sh scripts/release/publish.sh
          cargo fmt -p ytb2pdf-app -- --check

      - name: Build and test versioned binaries
        run: |
          cargo build --locked --release -p ytb2pdf-app -p ytb2pdf-cli
          cargo test --locked --release --workspace
          test "$(target/release/ytb2pdf-cli --version)" = "ytb2pdf $YTB2PDF_VERSION ($YTB2PDF_COMMIT)"
          test "$(target/release/ytb2pdf-app --version)" = "ytb2pdf $YTB2PDF_VERSION ($YTB2PDF_COMMIT)"

      - name: Bundle relocatable media runtime
        run: bash scripts/release/build-runtime.sh

      - name: Write versioned app metadata
        run: |
          python3 scripts/release/bundle-metadata.py
          plutil -lint dist/ytb2pdf-app.app/Contents/Info.plist

      - name: Ad-hoc sign and verify the app
        run: |
          codesign --force --deep --sign - dist/ytb2pdf-app.app
          codesign --verify --deep --strict --verbose=2 dist/ytb2pdf-app.app

      - name: Package versioned release assets
        run: python3 scripts/release/package.py

      - name: Verify relocated app and CLI archives offline
        run: |
          python3 scripts/release/smoke.py
          (cd dist/assets && shasum -a 256 -c SHA256SUMS.txt)

      - name: Upload complete release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ytb2pdf-v${{ steps.release.outputs.version }}-macos-arm64
          path: |
            dist/assets/*
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish complete GitHub Release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: bash scripts/release/publish.sh

      - name: Write release summary
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          cat dist/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n### SHA-256 checksums\n```\n' >> "$GITHUB_STEP_SUMMARY"
          cat dist/assets/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
